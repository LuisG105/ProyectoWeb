<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubre Chile - Inicio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            border-top: 6px solid #d52b1e; /* Rojo de la bandera chilena */
        }
        h1 {
            color: #0032a0; /* Azul de la bandera chilena */
            margin-bottom: 12px;
        }
        p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .destacados {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            text-align: left;
        }
        .caja {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #0032a0;
        }
        .caja h4 {
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .caja span {
            font-size: 0.9rem;
            color: #64748b;
        }
        .btn {
            display: inline-block;
            background-color: #0032a0;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #002270;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🇨🇱 Descubre Chile</h1>
        <p>Bienvenido al portal informativo de paisajes y cultura nacional, desde el Desierto de Atacama hasta los glaciares de la Patagonia.</p>

        <div class="destacados">
            <div class="caja">
                <h4>Norte Grande</h4>
                <span>Desierto y salares</span>
            </div>
            <div class="caja">
                <h4>Zona Central</h4>
                <span>Valles y cordillera</span>
            </div>
            <div class="caja">
                <h4>Zona Sur</h4>
                <span>Lagos y fiordos</span>
            </div>
        </div>

        <a href="/acerca/" class="btn">Ver ficha del autor y proyecto &rarr;</a>
    </div>

</body>
</html>
